services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      # ИСКЛЮЧЕНИЕ: Compose монтирует секреты в /run/secrets.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SOURCE:?Set the absolute path to the password file on the Docker host}
