services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:19.0-trixie}
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${PGBIND_PORT:-5434}:5432"
    volumes:
      # ИСКЛЮЧЕНИЕ: точка монтирования задана официальным образом PostgreSQL 19.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local

volumes:
  postgres_data:

networks:
  default:
    name: ${POSTGRES_NETWORK:-postgres-net}
    external: ${POSTGRES_NETWORK_EXTERNAL:-false}
